[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docstore"
version = "0.1.0"
description = "Local PDF document-store: vision-based statistics extraction, local embeddings, vector retrieval."
requires-python = ">=3.11"
# Runtime dependencies are the single source of truth in requirements.txt.
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
docstore = "docstore.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
include = ["docstore*"]

[tool.pytest.ini_options]
markers = [
    "live: end-to-end tests requiring Ollama + ANTHROPIC_API_KEY (deselect with '-m \"not live\"')",
]
