[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docstore"
version = "0.1.0"
description = "Local PDF document-store: vision-based statistics extraction, local embeddings, vector retrieval."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "lancedb>=0.13",
    "kuzu>=0.11",
    "pyarrow>=17",
    "ollama>=0.3",
    "anthropic>=0.39",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docstore = "docstore.cli:app"

[tool.setuptools.packages.find]
include = ["docstore*"]

[tool.pytest.ini_options]
markers = [
    "live: end-to-end tests requiring Ollama + ANTHROPIC_API_KEY (deselect with '-m \"not live\"')",
]
