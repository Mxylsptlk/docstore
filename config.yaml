# docstore configuration (non-secret settings only).
# The Anthropic API key is read from the ANTHROPIC_API_KEY environment variable,
# never from this file.

# Local embedding model (served by Ollama)
embed_model: nomic-embed-text

# Vision extraction backend: "claude" (default) or "ollama"
extraction_backend: claude
# "latest" resolves to the newest Sonnet at call time (Anthropic has no -latest alias
# for Sonnet). Or pin an explicit id, e.g. claude-sonnet-5 or a dated snapshot.
# Use "latest:opus" / "latest:haiku" for other families.
vision_model: latest

# Page render resolution for vision extraction / stat verification
render_dpi: 220

# Chunking
chunk_size: 1200
chunk_overlap: 150

# Storage
data_dir: data
table_name: chunks
answer_path: ANSWER.md
graph_dir: graph

# Behavior
verify_stats: true      # re-read each extracted statistic from its cropped region
force_vision: false     # true = send every page through vision (skip the gate)

# Knowledge graph
build_graph: true       # default: link every ingested doc into the Kùzu graph
                        # (override per-ingest with ingest(..., graph=False) / --no-graph)
entity_backend: regex   # regex (default, zero-dep) | ollama | claude
entity_model: llama3.1  # instruct model used only when entity_backend: ollama
